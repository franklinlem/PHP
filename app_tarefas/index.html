<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minhas Tarefas</title><link rel="stylesheet" href="style.css?v=4"></head><body>
<button id="theme" class="theme">🌙 <span>Tema escuro</span></button><div id="msg" class="msg hide"></div>
<section id="auth" class="center"><div class="card login"><small>TAREFAS.FRANKLEM.COM</small><h1>Minhas Tarefas</h1><p>Suas tarefas sincronizadas no celular e computador.</p><div class="tabs"><button class="tab on" data-tab="login">Entrar</button><button class="tab" data-tab="register">Criar conta</button></div><div id="error" class="error hide"></div>
<form id="login"><label>E-mail<input id="le" type="email" required></label><label>Senha<input id="lp" type="password" required></label><button class="primary">Entrar</button><p class="hint">Primeiro acesso? Clique em <b>Criar conta</b>.</p></form>
<form id="register" class="hide"><label>Nome<input id="rn" required></label><label>E-mail<input id="re" type="email" required></label><label>Senha<input id="rp" type="password" minlength="8" required></label><button class="primary">Criar minha conta</button></form><div id="health" class="health">Verificando MySQL...</div></div></section>
<div id="app" class="wrap hide"><header><div><small>TAREFAS.FRANKLEM.COM</small><h1>Minhas Tarefas</h1><p id="welcome"></p></div><button id="logout" class="secondary">Sair</button></header>
<section class="stats"><article><b id="total">0</b><span>Total</span></article><article><b id="pending">0</b><span>Pendentes</span></article><article><b id="done">0</b><span>Concluídas</span></article><article><b id="today">0</b><span>Hoje</span></article></section>
<section class="card"><h2 id="ft">Nova tarefa</h2><form id="task"><input id="id" type="hidden"><label>Tarefa<input id="title" required></label><label>Descrição<textarea id="desc"></textarea></label><div class="grid"><label>Data<input id="date" type="date"></label><label>Prioridade<select id="priority"><option value="baixa">Baixa</option><option value="media" selected>Média</option><option value="alta">Alta</option></select></label><label>Categoria<input id="cat"></label></div><button class="primary">Salvar tarefa</button><button id="cancel" type="button" class="secondary hide">Cancelar</button></form></section>
<section class="card tools"><input id="search" placeholder="Buscar tarefas..."><div><button class="filter on" data-f="all">Todas</button><button class="filter" data-f="pending">Pendentes</button><button class="filter" data-f="today">Hoje</button><button class="filter" data-f="done">Concluídas</button></div><select id="sort"><option value="new">Mais recentes</option><option value="due">Vencimento</option><option value="priority">Prioridade</option></select></section><div id="list"></div></div>
<script src="app.js?v=4"></script></body></html>
